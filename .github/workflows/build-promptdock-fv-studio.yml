name: Build PromptDock FreeVideo Studio for Windows
on:
  push:
    branches:
      - promptdock-fv-studio-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check Pillow pyinstaller
      - name: Verify source syntax
        run: python -m py_compile promptdock-fv-studio/studio.py
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PromptDock-FreeVideo-Studio --distpath dist --workpath tempbuild --specpath tempbuild promptdock-fv-studio/studio.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PromptDock-FreeVideo-Studio-Windows
          path: dist/PromptDock-FreeVideo-Studio.exe
          retention-days: 30
