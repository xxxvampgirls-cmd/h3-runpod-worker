name: Build PromptDock FreeVideo Studio for Windows
on:
  push:
    branches:
      - promptdock-fv-studio-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check Pillow pyinstaller send2trash imageio-ffmpeg ffpyplayer==4.5.4
      - name: Verify source syntax
        run: python -m py_compile promptdock-fv-studio/studio.py promptdock-fv-studio/reference_links.py promptdock-fv-studio/studio_player.py promptdock-fv-studio/cleanup.py promptdock-fv-studio/image_transfer.py
      - name: Test FreeVideo LoRA scanning and safe folder selection
        run: python promptdock-fv-studio/test_studio.py -v
      - name: Validate actual Windows GUI startup
        run: python promptdock-fv-studio/studio.py --smoke-ui
      - name: Check FreeVideo browser bridge syntax
        run: node --check promptdock-fv-studio/bridge/web/bridge.js
      - name: Verify complete local UI and embedded bridge installation
        run: python promptdock-fv-studio/smoke_ui.py
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PromptDock-FreeVideo-Studio --collect-binaries imageio_ffmpeg --collect-all ffpyplayer --distpath dist --workpath tempbuild --specpath tempbuild promptdock-fv-studio/studio.py
      - name: Test codecs from the actual packaged Windows executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path "dist/PromptDock-FreeVideo-Studio.exe") -ArgumentList "--smoke-codecs" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Bundled FFmpeg and ffpyplayer smoke test failed with exit code $($process.ExitCode)" }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PromptDock-FreeVideo-Studio-Windows
          path: dist/PromptDock-FreeVideo-Studio.exe
          retention-days: 30
